# Service Governance-owned overlay, Security Assurance-reviewed. Only these fields are BU-settable.
module: ram
claim_version: v1
exposed:
  name:
    required: true
    type: string
    pattern: "^[a-z][a-z0-9-]{2,40}$"
    virtual: true
    description: >-
      Logical name for the grant. Becomes the RAM role, group and policy name;
      a business unit never names those objects directly.
  identity_type:
    required: true
    type: string
    enum: [workload, group]
    virtual: true
    description: >-
      Who the grant is for. "workload" binds a Kubernetes service account through
      RRSA; "group" binds a directory group of human users.
  level:
    required: true
    type: string
    enum_from_sizing: levels
    virtual: true
    description: >-
      Access level. The platform resolves it to a concrete action list held in the
      access map. A business unit cannot enumerate API actions, which is what keeps
      privilege escalation out of a claim.
